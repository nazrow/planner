<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Planner</title>
		<link rel="stylesheet" href="css/main.css" />
	</head>
	<body class="workspace-page">
		<header id="bar">
			<span id="brand">Planner</span>
			<a class="nav" href="permissions.html">Permissions</a>
			<button id="hidden-note" type="button" hidden></button>
			<span id="status" role="status"></span>
			<span id="spacer"></span>
			<span id="zoom">
				<button id="zoom-out" type="button" title="Zoom out: more time on screen">−</button>
				<span id="zoom-label"></span>
				<button id="zoom-in" type="button" title="Zoom in: more room per hour">+</button>
			</span>
			<span id="who"></span>
			<button id="logout" type="button">Sign out</button>
		</header>

		<main id="viewport">
			<div id="surface">
				<!-- Dates down the left edge; stays put when scrolling sideways. -->
				<div id="ruler"></div>
				<svg id="edges" xmlns="http://www.w3.org/2000/svg">
					<g id="grid-layer"></g>
					<line id="now-line" />
					<g id="edge-layer"></g>
					<path id="live-edge" class="live" />
				</svg>
				<div id="nodes"></div>
			</div>
		</main>

		<p id="empty-hint">Click anywhere to start a task.</p>

		<!-- Offered in the people pickers; filled from the API on load. -->
		<datalist id="user-names"></datalist>
		<datalist id="role-names"></datalist>

		<script type="module" src="js/app.js"></script>
	</body>
</html>
