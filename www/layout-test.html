<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>layout tests</title>
		<style>
			body {
				font: 13px/1.5 ui-monospace, Consolas, monospace;
				padding: 1rem;
				background: #111;
				color: #ddd;
			}
			.ok::before {
				content: "ok   ";
				color: #6c6;
			}
			.fail::before {
				content: "FAIL ";
				color: #f66;
			}
			.fail {
				color: #f99;
			}
			.info {
				color: #9ab;
			}
			h2 {
				margin: 1rem 0 0.3rem;
				font-size: 13px;
				color: #8af;
			}
			#summary {
				margin-top: 1rem;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<div id="out"></div>
		<div id="summary"></div>
		<svg id="probe" width="0" height="0"></svg>
		<script type="module">
			import { layoutTimeline, effectiveDeadlines, DEFAULTS } from "./js/layout.js";

			const out = document.getElementById("out");
			let passed = 0;
			let failed = 0;

			function section(name) {
				const h = document.createElement("h2");
				h.textContent = name;
				out.appendChild(h);
			}
			function note(text) {
				const div = document.createElement("div");
				div.className = "info";
				div.textContent = text;
				out.appendChild(div);
			}
			function check(label, condition, detail) {
				const div = document.createElement("div");
				div.className = condition ? "ok" : "fail";
				div.textContent =
					label + (condition ? "" : "  -- " + JSON.stringify(detail ?? ""));
				out.appendChild(div);
				condition ? passed++ : failed++;
			}

			/* ------------------------------------------------- helpers */

			const H = 3600 * 1000;
			const DAY = 24 * H;
			const NOW = Date.UTC(2026, 8, 19, 12);
			const G = DEFAULTS.gapY;
			const near = (a, b, tol = 0.5) => Math.abs(a - b) <= tol;

			function run(nodes, edges, extra = {}) {
				return layoutTimeline(nodes, edges, { now: NOW, ...extra });
			}
			function byId(r) {
				return new Map(r.nodes.map((n) => [n.id, n]));
			}
			function overlaps(a, b) {
				return (
					a.x < b.x + b.width - 0.01 &&
					b.x < a.x + a.width - 0.01 &&
					a.y < b.y + b.height - 0.01 &&
					b.y < a.y + a.height - 0.01
				);
			}
			function firstOverlap(r) {
				const list = r.nodes;
				for (let i = 0; i < list.length; i++)
					for (let j = i + 1; j < list.length; j++)
						if (overlaps(list[i], list[j])) return [list[i].id, list[j].id];
				return null;
			}

			const probe = document.getElementById("probe");
			function edgeHit(edge, nodes, samples) {
				const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
				path.setAttribute("d", edge.path);
				probe.appendChild(path);
				const length = path.getTotalLength();
				let hit = null;
				for (let i = 0; i <= samples && !hit; i++) {
					const p = path.getPointAtLength((length * i) / samples);
					for (const n of nodes) {
						if (
							p.x > n.x + 1 &&
							p.x < n.x + n.width - 1 &&
							p.y > n.y + 1 &&
							p.y < n.y + n.height - 1
						) {
							hit = {
								edge: [edge.from, edge.to],
								box: n.id,
								at: [Math.round(p.x), Math.round(p.y)],
							};
							break;
						}
					}
				}
				path.remove();
				return hit;
			}
			function firstCrossing(r, samples = 300) {
				for (const e of r.edges) {
					const hit = edgeHit(e, r.nodes, samples);
					if (hit) return hit;
				}
				return null;
			}
			function firstTooClose(r, edges) {
				const m = byId(r);
				for (const e of edges) {
					const u = m.get(e.from);
					const v = m.get(e.to);
					if (u.y + u.height + G > v.y + 0.5) return [e.from, e.to, v.y - u.y - u.height];
				}
				return null;
			}

			const box = (id, extra = {}) => ({ id, width: 160, height: 100, ...extra });

			/**
			 * Vertical where an edge meets a card; one shared direction on both
			 * sides of every other joint -- no corners, no zero-length handles.
			 */
			function firstKink(r) {
				for (const e of r.edges) {
					const segs = e.segments;
					const [p0, c1] = segs[0];
					const last = segs[segs.length - 1];
					const [, , c2, p1] = last;
					if (Math.abs(c1[0] - p0[0]) > 0.01 || !(c1[1] > p0[1])) {
						return { edge: [e.from, e.to], where: "leaves its card not straight down" };
					}
					if (Math.abs(c2[0] - p1[0]) > 0.01 || !(c2[1] < p1[1])) {
						return { edge: [e.from, e.to], where: "arrives at its card not straight down" };
					}
					for (let i = 1; i < segs.length; i++) {
						const joint = segs[i][0];
						const inward = [joint[0] - segs[i - 1][2][0], joint[1] - segs[i - 1][2][1]];
						const outward = [segs[i][1][0] - joint[0], segs[i][1][1] - joint[1]];
						const a = Math.hypot(...inward);
						const b = Math.hypot(...outward);
						if (a < 0.01 || b < 0.01) {
							return { edge: [e.from, e.to], joint, where: "a handle shrank to nothing" };
						}
						const cross = (inward[0] * outward[1] - inward[1] * outward[0]) / (a * b);
						const dot = (inward[0] * outward[0] + inward[1] * outward[1]) / (a * b);
						if (Math.abs(cross) > 1e-6 || dot <= 0) {
							return { edge: [e.from, e.to], joint, where: "direction changes", cross, dot };
						}
					}
				}
				return null;
			}

			/* ------------------------------------------ 1: the deadline */

			section("a task with a deadline");
			{
				const due = NOW + 3 * DAY;
				const r = run([box("a", { due })], []);
				const a = byId(r).get("a");
				check("its bottom edge sits on the deadline", near(a.y + a.height, r.time.y(due)), {
					bottom: a.y + a.height,
					deadline: r.time.y(due),
				});
				check("the time axis maps back", near(r.time.at(r.time.y(due)), due, 1));
			}

			/* ------------------------------------------ 2: the estimate */

			section("a task with an estimate");
			{
				// Short or long, the estimate does not move the card itself.
				const due = NOW + 5 * DAY;
				for (const est of [10 * H, 3 * DAY, 20 * DAY]) {
					const r = run([box("a", { due, estimateMs: est })], []);
					const a = byId(r).get("a");
					check(
						`bottom edge on the deadline with ${est / H} h of work`,
						near(a.y + a.height, r.time.y(due)),
						{ bottom: a.y + a.height, deadline: r.time.y(due) }
					);
				}
			}

			/* --------------------------------- 2b: inherited deadlines */

			section("deadlines inherited through what a task blocks");
			{
				const d = NOW + 10 * DAY;
				// a -> b -> c: only c has a deadline; b and c have estimates.
				const nodes = [
					{ id: "a" },
					{ id: "b", estimateMs: 2 * DAY },
					{ id: "c", due: d, estimateMs: 1 * DAY },
				];
				const edges = [
					{ from: "a", to: "b" },
					{ from: "b", to: "c" },
				];
				const got = effectiveDeadlines(nodes, edges);
				check("its own deadline is kept", got.get("c").due === d && !got.get("c").calculated);
				check(
					"a blocker is needed by the time what it blocks has to start",
					got.get("b").due === d - DAY && got.get("b").calculated && got.get("b").from === "c",
					got.get("b")
				);
				check(
					"and that carries on up the chain",
					got.get("a").due === d - DAY - 2 * DAY && got.get("a").from === "b",
					got.get("a")
				);

				const two = effectiveDeadlines(
					[{ id: "x" }, { id: "early", due: NOW + 3 * DAY }, { id: "late", due: NOW + 9 * DAY }],
					[
						{ from: "x", to: "early" },
						{ from: "x", to: "late" },
					]
				);
				check("blocking several, the earliest start counts", two.get("x").due === NOW + 3 * DAY);

				const own = effectiveDeadlines(
					[{ id: "x", due: NOW + 20 * DAY }, { id: "y", due: NOW + 3 * DAY }],
					[{ from: "x", to: "y" }]
				);
				check("an explicit deadline is never replaced", own.get("x").due === NOW + 20 * DAY);

				const none = effectiveDeadlines([{ id: "p" }, { id: "q" }], [{ from: "p", to: "q" }]);
				check("no dates anywhere, nothing inherited", none.size === 0);

				const loop = effectiveDeadlines(
					[{ id: "p" }, { id: "q", due: NOW }],
					[
						{ from: "p", to: "q" },
						{ from: "q", to: "p" },
					]
				);
				check("a stray cycle does not hang it", loop.get("p").due === NOW);

				// And it places the card: a blocker with no date of its own sits
				// on its inherited deadline when there is room above what it blocks.
				const r = run(
					[box("prep"), box("event", { due: NOW + 8 * DAY, estimateMs: 5 * DAY })],
					[{ from: "prep", to: "event" }]
				);
				const m = byId(r);
				check(
					"a blocker's card sits on its inherited deadline",
					near(m.get("prep").y + m.get("prep").height, r.time.y(NOW + 3 * DAY)),
					{ bottom: m.get("prep").y + m.get("prep").height, inherited: r.time.y(NOW + 3 * DAY) }
				);
			}

			/* ------------------------------------------ 3: blockers above */

			section("a blocker due after what it blocks");
			{
				const r = run(
					[box("blocker", { due: NOW + 9 * DAY }), box("blocked", { due: NOW + 4 * DAY })],
					[{ from: "blocker", to: "blocked" }]
				);
				const m = byId(r);
				const blocked = m.get("blocked");
				const blocker = m.get("blocker");
				check(
					"the blocked task keeps its deadline",
					near(blocked.y + blocked.height, r.time.y(NOW + 4 * DAY))
				);
				check(
					"the blocker rises to just an arrow's room above it",
					near(blocker.y + blocker.height + G, blocked.y),
					{ gap: blocked.y - blocker.y - blocker.height }
				);
				const p = r.edges[0].points;
				check("drawn as one straight line", p.length === 2 && near(p[0][0], p[1][0]), p);
			}

			section("a blocker with no deadline of its own");
			{
				const r = run(
					[box("prep"), box("event", { due: NOW + 6 * DAY })],
					[{ from: "prep", to: "event" }]
				);
				const m = byId(r);
				check(
					"sits right above what it blocks",
					near(m.get("prep").y + 100 + G, m.get("event").y)
				);
			}

			/* --------------------------------------- 4: nothing to go by */

			section("tasks with no dates anywhere");
			{
				const r = run([box("a"), box("b")], [{ from: "a", to: "b" }]);
				const m = byId(r);
				check("start now", near(m.get("a").y, r.time.nowY));
				check("and follow each other down", near(m.get("a").y + 100 + G, m.get("b").y));
			}

			section("a finished task with no deadline");
			{
				const doneAt = NOW - 2 * DAY;
				const r = run([box("a", { doneAt })], []);
				const a = byId(r).get("a");
				check(
					"sits where it was finished, in the past",
					near(a.y + a.height, r.time.y(doneAt)) && a.y < r.time.nowY
				);
			}

			/* ------------------------------------------ 5: fan in, fan out */

			section("fan-out and fan-in");
			{
				const nodes = [
					box("root", { due: NOW + 1 * DAY }),
					box("x", { due: NOW + 3 * DAY, width: 224 }),
					box("y", { due: NOW + 3 * DAY, width: 112 }),
					box("z", { due: NOW + 3 * DAY }),
					box("join", { due: NOW + 6 * DAY }),
				];
				const edges = [
					{ from: "root", to: "x" },
					{ from: "root", to: "y" },
					{ from: "root", to: "z" },
					{ from: "x", to: "join" },
					{ from: "y", to: "join" },
					{ from: "z", to: "join" },
				];
				const r = run(nodes, edges);
				check("no overlaps", firstOverlap(r) === null, firstOverlap(r));
				check("arrow room everywhere", firstTooClose(r, edges) === null, firstTooClose(r, edges));
				check("no edge crosses a box", firstCrossing(r) === null, firstCrossing(r));
				check("nobody had to move down", r.stats.pushed === 0, r.stats);
			}

			section("bends use the room they have");
			{
				// root, then two tasks days later: one straight below it, the
				// other a column over, with plenty of empty height to bend in.
				const r = run(
					[
						// 15 days on: ~570px between them, room for two full bends.
						box("root", { due: NOW + 1 * DAY }),
						box("left", { due: NOW + 15 * DAY }),
						box("right", { due: NOW + 15 * DAY }),
					],
					[
						{ from: "root", to: "left" },
						{ from: "root", to: "right" },
					]
				);
				const bent = r.edges.find((e) => e.points.length > 2);
				const [p0, p1] = bent.points;
				const sideways = Math.abs(p1[0] - p0[0]);
				const height = p1[1] - p0[1];
				check(
					"the bend leaving the blocker is gentle, not a 16px kink",
					height >= DEFAULTS.bendRatio * sideways - 0.5,
					{ sideways, height }
				);
				check("and still crosses nothing", firstCrossing(r) === null, firstCrossing(r));
			}

			section("bends share the room when it is short");
			{
				// Only 5 days apart: ~140px for two bends that would each like 176.
				const r = run(
					[
						box("root", { due: NOW + 1 * DAY }),
						box("left", { due: NOW + 6 * DAY }),
						box("right", { due: NOW + 6 * DAY }),
					],
					[
						{ from: "root", to: "left" },
						{ from: "root", to: "right" },
					]
				);
				const bent = r.edges.find((e) => e.points.length > 2);
				const p = bent.points;
				const used = p[p.length - 1][1] - p[0][1];
				const bendHeights = [p[1][1] - p[0][1], p[p.length - 1][1] - p[p.length - 2][1]];
				check(
					"they use all of it between them",
					near(bendHeights[0] + bendHeights[1], used, 1),
					{ bendHeights, used }
				);
				check("and still cross nothing", firstCrossing(r) === null, firstCrossing(r));
			}

			/* ------------------------------------------ 6: packing groups */

			section("a small group later in time slides in beside a big one");
			{
				const early = [];
				const edges = [];
				for (let i = 0; i < 4; i++) {
					early.push(box("e" + i, { due: NOW + (1 + i) * DAY, width: 224 }));
					early.push(box("f" + i, { due: NOW + (1 + i) * DAY, width: 224 }));
					if (i) {
						edges.push({ from: "e" + (i - 1), to: "e" + i });
						edges.push({ from: "f" + (i - 1), to: "f" + i });
					}
					edges.push({ from: "e" + i, to: "f" + i });
				}
				const late = [
					box("late1", { due: NOW + 30 * DAY }),
					box("late2", { due: NOW + 31 * DAY }),
				];
				edges.push({ from: "late1", to: "late2" });
				const r = run([...early, ...late], edges);
				const m = byId(r);
				const earlyRight = Math.max(...early.map((n) => m.get(n.id).x + m.get(n.id).width));
				check("the late group tucks in under the early one, on the left", m.get("late1").x < 100, {
					x: m.get("late1").x,
				});
				check("so the drawing is no wider than the early group", r.width <= earlyRight + 1, {
					width: r.width,
					earlyRight,
				});
			}

			section("two groups at the same time keep their distance");
			{
				const r = run(
					[
						box("a1", { due: NOW + 2 * DAY }),
						box("a2", { due: NOW + 4 * DAY }),
						box("b1", { due: NOW + 2 * DAY }),
						box("b2", { due: NOW + 4 * DAY }),
					],
					[
						{ from: "a1", to: "a2" },
						{ from: "b1", to: "b2" },
					]
				);
				const m = byId(r);
				const a = [m.get("a1"), m.get("a2")];
				const b = [m.get("b1"), m.get("b2")];
				const gap = Math.max(
					Math.min(...b.map((n) => n.x)) - Math.max(...a.map((n) => n.x + n.width)),
					Math.min(...a.map((n) => n.x)) - Math.max(...b.map((n) => n.x + n.width))
				);
				check("at least the group gap apart", gap >= DEFAULTS.componentGap - 1, { gap });
			}

			/* ------------------------------------- 6b: groups with no dates */

			/** Small dateless trees: a chain of 1..3 cards each, no dates. */
			function floaterTrees(count, prefix = "t") {
				const nodes = [];
				const edges = [];
				for (let t = 0; t < count; t++) {
					const length = 1 + (t % 3);
					for (let k = 0; k < length; k++) {
						nodes.push(box(`${prefix}${t}.${k}`, { height: 60 + 20 * k }));
						if (k) edges.push({ from: `${prefix}${t}.${k - 1}`, to: `${prefix}${t}.${k}` });
					}
				}
				return { nodes, edges };
			}
			/** Each tree's first card, which is also its top. */
			const rootsOf = (r, count, prefix = "t") =>
				Array.from({ length: count }, (_, t) => byId(r).get(`${prefix}${t}.0`));
			const rowsOf = (roots) => [...new Set(roots.map((n) => Math.round(n.y)))].sort((a, b) => a - b);

			section("a dozen small trees with no dates");
			{
				const { nodes, edges } = floaterTrees(12);
				const r = run(nodes, edges, { viewWidth: 900 });
				const roots = rootsOf(r, 12);
				const rows = rowsOf(roots);
				check("wrap into several rows instead of one", rows.length > 1 && rows.length <= 5, { rows });
				check("the first row starts now", near(rows[0], r.time.nowY), { first: rows[0], now: r.time.nowY });
				check("no wider than asked", r.width <= 900 + 1, { width: r.width });

				// Every card of a row sits above every card of the next row.
				const rowOf = new Map();
				roots.forEach((root, t) => rowOf.set(t, rows.indexOf(Math.round(root.y))));
				let stacked = true;
				for (const a of r.nodes) {
					for (const b of r.nodes) {
						const ra = rowOf.get(Number(a.id.slice(1).split(".")[0]));
						const rb = rowOf.get(Number(b.id.slice(1).split(".")[0]));
						if (rb === ra + 1 && a.y + a.height + DEFAULTS.componentGap > b.y + 0.5) stacked = false;
					}
				}
				check("each row starts a group gap below the one above", stacked);
				check("in the order they were made", roots[0].y <= roots[11].y);
				check("nothing overlaps", firstOverlap(r) === null, firstOverlap(r));
				check("nothing counts as moved down", r.stats.pushed === 0, r.stats);
			}

			section("a few small trees that fit");
			{
				const { nodes, edges } = floaterTrees(3);
				const r = run(nodes, edges, { viewWidth: 900 });
				const rows = rowsOf(rootsOf(r, 3));
				check("stay in one row at now", rows.length === 1 && near(rows[0], r.time.nowY), { rows });
			}

			section("a flood of small trees");
			{
				const { nodes, edges } = floaterTrees(40);
				const r = run(nodes, edges, { viewWidth: 400 });
				const rows = rowsOf(rootsOf(r, 40));
				check("never more than five rows", rows.length <= DEFAULTS.floaterRows, { rows: rows.length });
				check("nothing overlaps", firstOverlap(r) === null, firstOverlap(r));
			}

			section("trees with dates are left where they are");
			{
				const dated = [
					box("d1", { due: NOW + 2 * DAY }),
					box("d2", { due: NOW + 5 * DAY }),
				];
				const datedEdges = [{ from: "d1", to: "d2" }];
				const alone = byId(run(dated, datedEdges, { viewWidth: 900 }));
				const { nodes, edges } = floaterTrees(12);
				const mixed = run([...dated, ...nodes], [...datedEdges, ...edges], { viewWidth: 900 });
				const withFloaters = byId(mixed);
				const shift = mixed.time.nowY - run(dated, datedEdges).time.nowY;
				check(
					"same times as without the floaters",
					near(withFloaters.get("d1").y - shift, alone.get("d1").y) &&
						near(withFloaters.get("d2").y - shift, alone.get("d2").y),
					{ d1: [withFloaters.get("d1").y - shift, alone.get("d1").y] }
				);
				check("and nothing collides", firstOverlap(mixed) === null, firstOverlap(mixed));
				check(
					"floaters wrap around the dated tree, keeping the drawing within the width",
					mixed.width <= 900 + 1,
					{ width: mixed.width }
				);
				check("no edge crosses a card", firstCrossing(mixed) === null, firstCrossing(mixed));
			}

			/* ------------------------------------------ 7: random stress */

			function rng(seed) {
				return () => {
					seed |= 0;
					seed = (seed + 0x6d2b79f5) | 0;
					let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
					t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
					return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
				};
			}
			function randomCase(seed) {
				const r = rng(seed);
				const count = 2 + Math.floor(r() * 22);
				const nodes = [];
				for (let i = 0; i < count; i++) {
					const n = {
						id: "n" + i,
						width: 112 + Math.floor(r() * 113),
						height: 50 + Math.floor(r() * 200),
					};
					const kind = r();
					if (kind < 0.6) n.due = NOW + (r() * 40 - 10) * DAY;
					if (kind < 0.6 && r() < 0.6) n.estimateMs = r() * 5 * DAY;
					if (kind > 0.9) n.doneAt = NOW - r() * 20 * DAY;
					nodes.push(n);
				}
				const edges = [];
				for (let j = 1; j < count; j++) {
					for (let i = 0; i < j; i++) {
						if (r() < 2.2 / j) edges.push({ from: "n" + i, to: "n" + j });
					}
				}
				return { nodes, edges };
			}
			function groupsOf(nodes, edges) {
				const parent = new Map(nodes.map((n) => [n.id, n.id]));
				const find = (x) => {
					while (parent.get(x) !== x) x = parent.get(x);
					return x;
				};
				for (const e of edges) parent.set(find(e.from), find(e.to));
				return find;
			}

			section("300 random task graphs");
			{
				let boxes = 0;
				let pushed = 0;
				const problems = {};
				const started = performance.now();
				for (let seed = 1; seed <= 300; seed++) {
					const { nodes, edges } = randomCase(seed);
					// Dateless groups stack into rows too, so every check covers that.
					const r = run(nodes, edges, { viewWidth: 1000 });
					boxes += nodes.length;
					pushed += r.stats.pushed;

					if (!problems.overlap && firstOverlap(r)) {
						problems.overlap = { seed, pair: firstOverlap(r) };
					}
					if (!problems.tooClose && firstTooClose(r, edges)) {
						problems.tooClose = { seed, edge: firstTooClose(r, edges) };
					}
					if (!problems.crossing) {
						const hit = firstCrossing(r, 120);
						if (hit) problems.crossing = { seed, ...hit };
					}
					if (!problems.kink) {
						const kink = firstKink(r);
						if (kink) problems.kink = { seed, ...kink };
					}

					const group = groupsOf(nodes, edges);
					const list = r.nodes;
					const gap = DEFAULTS.componentGap;
					for (let i = 0; i < list.length && !problems.groupGap; i++) {
						for (let j = i + 1; j < list.length; j++) {
							const a = list[i];
							const b = list[j];
							if (group(a.id) === group(b.id)) continue;
							if (!(a.y < b.y + b.height + gap && b.y < a.y + a.height + gap)) continue;
							const apart = Math.max(b.x - (a.x + a.width), a.x - (b.x + b.width));
							if (apart < gap - 1) {
								problems.groupGap = { seed, pair: [a.id, b.id], apart };
								break;
							}
						}
					}

					const m = byId(r);
					const inherited = effectiveDeadlines(nodes, edges);
					for (const n of nodes) {
						const p = m.get(n.id);
						const due = inherited.get(n.id);
						if (p.pushed || !due || problems.deadline) continue;
						if (p.y + p.height > r.time.y(due.due) + 0.5) {
							problems.deadline = { seed, id: n.id, calculated: due.calculated };
						}
					}
				}
				const ms = performance.now() - started;
				check("no two boxes overlap", !problems.overlap, problems.overlap);
				check("every blocker sits an arrow's room above", !problems.tooClose, problems.tooClose);
				check("no edge crosses a box", !problems.crossing, problems.crossing);
				check(
					"curves turn smoothly at every joint, vertical only at cards",
					!problems.kink,
					problems.kink
				);
				check("separate groups keep their gap", !problems.groupGap, problems.groupGap);
				check(
					"cards not moved down end by their deadline, own or inherited",
					!problems.deadline,
					problems.deadline
				);
				note(
					`300 graphs, ${boxes} boxes; ${pushed} moved down for an arrow ` +
						`(${((100 * pushed) / boxes).toFixed(1)}%); ${ms.toFixed(0)} ms including checks`
				);
			}

			/* --------------------------------------- 7b: the search */

			const contentWidth = (r) =>
				Math.max(...r.nodes.map((n) => n.x + n.width)) - Math.min(...r.nodes.map((n) => n.x));
			const massCentre = (r) => {
				let mass = 0;
				let moment = 0;
				for (const n of r.nodes) {
					mass += n.width * n.height;
					moment += n.width * n.height * (n.x + n.width / 2);
				}
				return moment / mass;
			};
			const same = (a, b) =>
				JSON.stringify(a.nodes) === JSON.stringify(b.nodes) &&
				JSON.stringify(a.edges) === JSON.stringify(b.edges);

			section("searching for a better arrangement");
			{
				const { nodes, edges } = randomCase(11);
				const opts = { viewWidth: 1200, optimize: true };
				const a = run(nodes, edges, opts);
				const b = run(nodes, edges, opts);
				check("same input, same result", same(a, b));
				const replay = run(nodes, edges, { viewWidth: 1200, hints: a.hints });
				check("its choices replay exactly without searching", same(a, replay));
				const again = run(nodes, edges, { ...opts, hints: a.hints });
				check("searching again from them changes nothing", same(a, again));
			}

			section("a tree alone on a wide screen");
			{
				const r = run(
					[box("a", { due: NOW + DAY }), box("b", { due: NOW + 3 * DAY })],
					[{ from: "a", to: "b" }],
					{ viewWidth: 1200, optimize: true }
				);
				check("sits in the middle of it", near(massCentre(r), 600, 1), { centre: massCentre(r) });
			}

			section("150 random task graphs, searched");
			{
				let improved = 0;
				let widthBefore = 0;
				let widthAfter = 0;
				let offBefore = 0;
				let offAfter = 0;
				let slowest = 0;
				const problems = {};
				for (let seed = 1; seed <= 150; seed++) {
					const { nodes, edges } = randomCase(seed);
					const plain = run(nodes, edges, { viewWidth: 1000 });
					const t0 = performance.now();
					const best = run(nodes, edges, { viewWidth: 1000, optimize: true });
					slowest = Math.max(slowest, performance.now() - t0);

					if (best.stats.packing.chosen > best.stats.packing.initial + 0.5 && !problems.worse) {
						problems.worse = { seed, ...best.stats.packing };
					}
					if (best.stats.pushed > plain.stats.pushed && !problems.pushed) {
						problems.pushed = { seed, plain: plain.stats.pushed, best: best.stats.pushed };
					}
					if (best.stats.packing.chosen < best.stats.packing.initial - 0.5) improved++;
					widthBefore += contentWidth(plain);
					widthAfter += contentWidth(best);
					offBefore += Math.abs(massCentre(plain) - 500);
					offAfter += Math.abs(massCentre(best) - 500);

					if (!problems.overlap && firstOverlap(best)) problems.overlap = { seed };
					if (!problems.tooClose && firstTooClose(best, edges)) problems.tooClose = { seed };
					if (!problems.crossing) {
						const hit = firstCrossing(best, 100);
						if (hit) problems.crossing = { seed, ...hit };
					}
					if (!problems.kink) {
						const kink = firstKink(best);
						if (kink) problems.kink = { seed, ...kink };
					}
				}
				check("never worse than the plain layout", !problems.worse, problems.worse);
				check("never moves more cards off their dates", !problems.pushed, problems.pushed);
				check("no two boxes overlap", !problems.overlap, problems.overlap);
				check("every blocker sits an arrow's room above", !problems.tooClose, problems.tooClose);
				check("no edge crosses a box", !problems.crossing, problems.crossing);
				check("curves still turn smoothly", !problems.kink, problems.kink);
				check("the search finds something better somewhere", improved > 0, { improved });
				note(
					`improved ${improved} of 150; content width ${Math.round(widthBefore / 150)} -> ` +
						`${Math.round(widthAfter / 150)} px on average; mass off-centre ` +
						`${Math.round(offBefore / 150)} -> ${Math.round(offAfter / 150)} px; ` +
						`slowest search ${slowest.toFixed(0)} ms`
				);
			}

			/* ------------------------------------------ 8: speed, sameness */

			section("a large graph");
			{
				const { nodes, edges } = randomCase(424242);
				while (nodes.length < 150) {
					const i = nodes.length;
					nodes.push({ id: "n" + i, width: 160, height: 90, due: NOW + (i % 40) * DAY });
					if (i > 5) edges.push({ from: "n" + (i - 3), to: "n" + i });
				}
				const t0 = performance.now();
				const r = run(nodes, edges);
				const ms = performance.now() - t0;
				check("150 tasks lay out in well under a second", ms < 800, { ms });
				const s0 = performance.now();
				run(nodes, edges, { viewWidth: 1400, optimize: true });
				const searchMs = performance.now() - s0;
				check("and are searched in well under a second", searchMs < 1000, { searchMs });
				note(`search: ${searchMs.toFixed(0)} ms`);
				check("still no overlaps", firstOverlap(r) === null, firstOverlap(r));
				check("still no crossings", firstCrossing(r, 120) === null, firstCrossing(r, 120));
				note(`${ms.toFixed(0)} ms; ${r.stats.pushed} moved down`);
			}

			section("same input, same output");
			{
				const { nodes, edges } = randomCase(7);
				const a = run(nodes, edges);
				const b = run(nodes, edges);
				check(
					"deterministic",
					JSON.stringify(a.nodes) === JSON.stringify(b.nodes) &&
						JSON.stringify(a.edges) === JSON.stringify(b.edges)
				);
			}

			document.getElementById("summary").textContent =
				passed + " passed, " + failed + " failed";
			document.title = failed ? "FAIL" : "PASS";
		</script>
	</body>
</html>
