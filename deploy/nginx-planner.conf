# nginx site for the planner, e.g. /etc/nginx/sites-available/planner
#
# The app serves its own pages and static files, so nginx only terminates TLS
# and passes every request through untouched. No `root`, no `index`, and no
# trailing slash on proxy_pass: the /api prefix must reach the app as-is.

server {
    listen 80;
    listen [::]:80;
    server_name planner.nazrow.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name planner.nazrow.ru;

    # Keep whatever certificate lines certbot already wrote for this host.
    ssl_certificate     /etc/letsencrypt/live/planner.nazrow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planner.nazrow.ru/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:11111;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
